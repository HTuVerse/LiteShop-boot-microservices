server:
  port: 9008

spring:
  application:
    name: liteShop-config-service
  config:
    # Nacos 连接参数与配置导入统一由 liteShop-nacos-starter 提供，修改请编辑
    # liteShop-nacos-starter/src/main/resources/liteshop-nacos.yml
    import: "classpath:liteshop-nacos.yml"

liteshop:
  credentials:
    # 首次保存 MinIO/OSS 等凭据前由进程环境注入；所有配置服务实例须使用同一固定值。
    encryption-key: ${CONFIG_CREDENTIAL_ENCRYPTION_KEY:}
