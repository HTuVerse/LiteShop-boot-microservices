spring:
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:}
      timeout: ${AI_TIMEOUT:60s}
      max-retries: ${AI_MAX_RETRIES:3}
      chat:
        model: ${AI_MODEL:gpt-5-mini}

lite-shop:
  ai:
    system-prompt: >-
      你是 LiteShop 的智能助手。回答应准确、简洁；当缺少业务数据时明确说明，
      不得编造订单、库存、余额、优惠券或支付状态。
