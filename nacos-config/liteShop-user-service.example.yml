spring:
  datasource:
    url: ${MYSQL_URL_USER:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/liteshop_user?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2b8}

app:
  webSite:
    name: ${WEBSITE_NAME:乌龙街老茶馆}

wx:
  appid: ${WX_APP_ID}
  secret: ${WX_APP_SECRET}

liteshop:
  audit:
    # 正式环境注入独立密钥；轮换时配置新的 key-version，并在 historical-keys 中保留旧版本密钥。
    hmac-key: ${AUDIT_HMAC_KEY:liteshop-local-audit-key-change-before-production-20261024}
    key-version: ${AUDIT_HMAC_KEY_VERSION:local-v1}
    # 本地将用户提供的 MMDB 放在仓库 runtime 目录；部署环境使用绝对路径挂载。
    geo-db-path: ${GEOIP_CITY_DB_PATH:runtime/GeoLite2-City.mmdb}
    geo-db-version: ${GEOIP_CITY_DB_VERSION:20261023}
    anchor-path: ${AUDIT_ANCHOR_PATH:runtime/audit-anchors.jsonl}
