spring:
  datasource:
    url: ${MYSQL_URL_FILE:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/liteshop_file?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2b8}
  servlet:
    # HTTP 解析上限须不小于超级管理员配置的单文件上限。
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB
