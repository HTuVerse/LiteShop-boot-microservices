spring:
  cloud:
    gateway:
      server:
        webflux:
          # 只允许配置的前端来源。生产环境设置 LITESHOP_CORS_ORIGINS，多个来源用逗号分隔。
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${LITESHOP_CORS_ORIGINS:http://localhost:*}
                allowed-methods: "*"
                allowed-headers: "*"
                max-age: 3600
          routes:
            - id: user-service
              uri: lb://liteShop-user-service
              predicates:
                - Path=/user/**,/surplus-record/**,/sys-role/**,/user-level/**,/sys-role-permission/**,/sys-permission/**,/user-points-record/**,/sys-user-role/**,/sys-user-store/**,/sys-tenant/**,/saas/**
            - id: coupon-service
              uri: lb://liteShop-coupon-service
              predicates:
                - Path=/coupon/**,/user-coupon/**,/verify-record/**
            - id: mall-service
              uri: lb://liteShop-mall-service
              predicates:
                - Path=/points-mall/**
            - id: lottery-service
              uri: lb://liteShop-lottery-service
              predicates:
                - Path=/lottery-activity/**,/lottery-prize/**,/activity-prize/**,/lottery-record/**,/user-activity-chance/**
            - id: restaurant-service
              uri: lb://liteShop-restaurant-service
              predicates:
                - Path=/dish/**,/store-info/**,/table-info/**,/table-session/**,/shared-cart/**,/restaurant-order/**,/restaurant-order-item/**,/restaurant-analysis/**,/tenant-analysis/**,/printTemplateApi/**,/orderPrintApi/**,/feieyunApi/**,/table-reservation/**
            - id: message-service
              uri: lb://liteShop-message-service
              predicates:
                - Path=/msg/**
              metadata:
                # SSE 是长连接，不能继承网关的普通 HTTP 响应超时。
                response-timeout: -1
            - id: file-service
              uri: lb://liteShop-file-service
              predicates:
                - Path=/file-upload/**,/images/**
            - id: config-service
              uri: lb://liteShop-config-service
              predicates:
                - Path=/config/**
            - id: ai-service
              uri: lb://liteShop-ai-service
              predicates:
                - Path=/ai/**
