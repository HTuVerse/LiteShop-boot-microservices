# 先复制两个 example 配置并填写内网地址、令牌和告警接收器。
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "${MONITOR_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/discovery.token:/etc/prometheus/discovery.token:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

volumes:
  prometheus-data:
  alertmanager-data:
