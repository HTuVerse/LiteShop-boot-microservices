groups:
  - name: liteshop-availability
    rules:
      - alert: LiteShopDiscoveryDown
        expr: up{job="liteshop-bootstrap"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "配置服务或监控发现接口所在机器失联"
      - alert: LiteShopTargetDown
        expr: up{job=~"liteshop-app|liteshop-host|liteshop-mysql|liteshop-redis|liteshop-rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "采集目标失联：{{ $labels.job }} / {{ $labels.instance }}"
      - alert: LiteShopServiceAbsent
        expr: |
          absent(up{job="liteshop-app",service="liteshop-gateway"})
          or absent(up{job="liteshop-app",service="liteshop-user-service"})
          or absent(up{job="liteshop-app",service="liteshop-coupon-service"})
          or absent(up{job="liteshop-app",service="liteshop-mall-service"})
          or absent(up{job="liteshop-app",service="liteshop-lottery-service"})
          or absent(up{job="liteshop-app",service="liteshop-restaurant-service"})
          or absent(up{job="liteshop-app",service="liteshop-pay-service"})
          or absent(up{job="liteshop-app",service="liteshop-message-service"})
          or absent(up{job="liteshop-app",service="liteshop-file-service"})
          or absent(up{job="liteshop-app",service="liteshop-config-service"})
          or absent(up{job="liteshop-app",service="liteshop-ai-service"})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "服务全部实例已从发现列表消失：{{ $labels.service }}"
  - name: liteshop-resources
    rules:
      - alert: LiteShopHostCpuHigh
        expr: 100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{job="liteshop-host",mode="idle"}[5m]))) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU 持续高于 85%：{{ $labels.instance }}"
      - alert: LiteShopHostMemoryHigh
        expr: 100 * (1 - node_memory_MemAvailable_bytes{job="liteshop-host"} / node_memory_MemTotal_bytes{job="liteshop-host"}) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "内存持续高于 90%：{{ $labels.instance }}"
      - alert: LiteShopHostDiskLow
        expr: 100 * node_filesystem_avail_bytes{job="liteshop-host",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="liteshop-host",fstype!~"tmpfs|overlay"} < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "磁盘剩余空间低于 15%：{{ $labels.instance }} / {{ $labels.mountpoint }}"
